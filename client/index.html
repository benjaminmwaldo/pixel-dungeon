<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05050c">
<title>Pixel Dungeon</title>
<link rel="stylesheet" href="/client/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23000'/><rect x='3' y='2' width='10' height='3' fill='%2300a800'/><rect x='4' y='5' width='8' height='4' fill='%23fcd8a8'/><rect x='3' y='9' width='10' height='5' fill='%2300a800'/></svg>">
</head>
<body>
  <div id="frame">
    <canvas id="screen" width="320" height="240"></canvas>
    <div id="touch">
      <div id="dpad">
        <div class="pad" id="pad-up"></div>
        <div class="pad" id="pad-left"></div>
        <div class="pad" id="pad-right"></div>
        <div class="pad" id="pad-down"></div>
      </div>
      <div id="buttons">
        <div class="btn" id="btn-cycle">C</div>
        <div class="btn" id="btn-start">ST</div>
        <div class="btn big" id="btn-b">B</div>
        <div class="btn big" id="btn-a">A</div>
      </div>
    </div>
  </div>
  <script type="module" src="/client/main.js"></script>
</body>
</html>
