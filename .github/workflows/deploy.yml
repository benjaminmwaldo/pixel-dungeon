name: Deploy Pixel Dungeon to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test and build
        run: |
          node scripts/validate-art.js
          node scripts/levelgen-test.js 10
          node scripts/smoke.js
          node scripts/buff-test.js
          node scripts/trap-test.js
          node scripts/shop-test.js
          node scripts/secrets-test.js
          node scripts/ench-test.js
          node scripts/ring-test.js
          node scripts/wand-test.js
          node scripts/missile-test.js
          node scripts/artifact-test.js
          node scripts/champion-test.js
          node scripts/boss-test.js
          node scripts/quest-test.js
          node scripts/roster-test.js
          node scripts/plant-test.js
          node scripts/alchemy-test.js
          node scripts/ascent-test.js
          node scripts/build-pages.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
